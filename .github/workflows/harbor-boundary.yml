name: Harbor isolated export calibration (self-test)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'poc/harbor_export/**'
      - 'tests/test_harbor_export.py'
      - 'evaluator/**'
      - 'discovery/**'
      - 'fixtures/project_board/**'
      - '.github/workflows/harbor-boundary.yml'
      - 'VERSION'
  push:
    branches: [main]
    paths:
      - 'poc/harbor_export/**'
      - '.github/workflows/harbor-boundary.yml'
      - 'VERSION'
permissions:
  contents: read
jobs:
  harbor-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HARBOR_TELEMETRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixed Harbor
        run: |
          python -m pip install 'harbor==0.25.0'
          harbor --version
          python -m pip freeze > "$RUNNER_TEMP/harbor-dependencies.txt"
          docker version
      - name: Resolve and record immutable image
        run: |
          docker pull python:3.12.12-slim-bookworm
          image_ref=$(docker image inspect python:3.12.12-slim-bookworm --format '{{index .RepoDigests 0}}')
          python poc/harbor_export/prepare.py "$RUNNER_TEMP/ads-harbor" --image "$image_ref" > "$RUNNER_TEMP/ads-harbor-prepare.json"
      - name: Validate native task schema
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from harbor.models.task.task import Task
          for p in (Path(os.environ['RUNNER_TEMP'])/'ads-harbor/tasks').iterdir():
              task = Task(p)
              assert task.config.verifier.environment_mode.value == 'separate'
          PY
      - name: Run real Docker oracle calibration
        run: |
          harbor run --path "$RUNNER_TEMP/ads-harbor/tasks" --agent oracle --env docker --n-concurrent 1 --job-name boundary --jobs-dir "$RUNNER_TEMP/ads-harbor/jobs"
      - name: Require positive, negative and tamper results
        if: ${{ !cancelled() }}
        run: |
          python poc/harbor_export/check_results.py "$RUNNER_TEMP/ads-harbor" "$RUNNER_TEMP/ads-harbor/jobs/boundary" --out artifacts/harbor-boundary-summary.json
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ads-harbor-boundary
          path: |
            artifacts/harbor-boundary-summary.json
            ${{ runner.temp }}/harbor-dependencies.txt
            ${{ runner.temp }}/ads-harbor/manifest.json
            ${{ runner.temp }}/ads-harbor/jobs/
          if-no-files-found: error
