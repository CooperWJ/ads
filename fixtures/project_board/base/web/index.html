<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fictional Project Board</title>
<style>body{font:16px system-ui;max-width:850px;margin:40px auto;padding:20px;color:#1d2939}main{display:grid;gap:20px}section{background:#f7f8fa;padding:18px;border-radius:10px}label{display:block;margin:9px 0}select,input,button{padding:9px;font:inherit}dl{display:grid;grid-template-columns:180px 1fr;gap:10px}dt{font-weight:bold}button{margin:8px 8px 8px 0}#message{min-height:25px}</style></head>
<body><main><h1>Fictional Project Board</h1><label for="project-select">Select project</label><select id="project-select"><option value="">Select a project</option></select>
<section id="project-details" aria-label="Project details" hidden><h2>Read-only project details</h2><dl>
<dt>Title</dt><dd data-field="title"></dd><dt>Category</dt><dd data-field="category"></dd><dt>Phase</dt><dd data-field="phase"></dd><dt>Owner</dt><dd data-field="owner"></dd><dt>Milestone start</dt><dd data-field="milestone_start"></dd><dt>Milestone end</dt><dd data-field="milestone_end"></dd><dt>Reference code</dt><dd data-field="reference_code"></dd>
</dl><label for="notes">Editable notes</label><input id="notes" maxlength="200"/><div><button id="save">Save notes</button><button id="export" disabled>Export XLSX</button></div></section>
<p id="message" role="status"></p></main><script src="/app.js"></script></body></html>
